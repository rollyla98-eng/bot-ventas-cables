name: Publicar en Facebook e Instagram

on:
  workflow_dispatch: # Botón para publicar manualmente cuando quieras
  schedule:
    # 2 publicaciones al día en horarios clave (Hora Perú):
    - cron: '0 18 * * *' # 1:00 PM (Hora de almuerzo)
    - cron: '0 1 * * *'  # 8:00 PM (Horario estelar de compras)

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías de IA y Redes
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Ejecutar Bot de Publicación
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python bot.py
