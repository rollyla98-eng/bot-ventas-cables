services:
  - type: web
    name: bot-ventas-whatsapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WHATSAPP_PEDIDOS
        value: "51910371606"
      - key: GEMINI_MODEL
        sync: false
      - key: MODO_PRUEBA_NUMEROS
        sync: false
      - key: SILENCIO_DUENO_HORAS
        sync: false
      - key: PANEL_COPY_URL
        sync: false
      - key: PANEL_VIDEO_URL
        sync: false
      - key: PANEL_INFO_URL
        sync: false
      - key: PANEL_APP_URL
        sync: false
      - key: SEGUIMIENTO_ACTIVO
        sync: false
      - key: WA_TEMPLATE_SEGUIMIENTO
        sync: false
      - key: WA_TEMPLATE_FIN_PRUEBA
        sync: false
      - key: WA_TEMPLATE_LANG
        sync: false
      - key: CRON_SECRETO
        sync: false
      - key: PRO_PRUEBA_DIAS
        sync: false
      - key: PRO_PRECIO_MENSUAL
        sync: false
      - key: PRO_PRECIO_ANUAL
        sync: false
      - key: PRO_DIAS_MENSUAL
        sync: false
      - key: PRO_DIAS_ANUAL
        sync: false
      - key: PLAN_GRATIS_MOVIMIENTOS
        sync: false
      - key: PLAN_GRATIS_FIADOS
        sync: false
      - key: PAGO_METODO
        sync: false
      - key: PAGO_TITULAR
        sync: false
      - key: PAGO_NUMERO
        sync: false
      - key: PAGO_QR_URL
        sync: false
